<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spatial Overview — SkyPulse-Ops</title>
<link rel="stylesheet" href="/css/styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
</head>
<body>
<div class="shell">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main">
    <div class="page-header">
      <div>
        <h1>Spatial Overview</h1>
        <p>Operational zones, survey corridors, delivery routes, and recent flight tracks.</p>
      </div>
    </div>

    <div class="panel">
      <div class="panel-body pad">
        <div id="map"></div>
        <div class="legend">
          <span><span class="dot" style="background:#192853"></span> Operational zone</span>
          <span><span class="dot" style="background:#F0CF2E"></span> Survey corridor</span>
          <span><span class="dot" style="background:#3E6FB0"></span> Delivery route</span>
          <span><span class="dot" style="background:#C1432E"></span> Restricted</span>
          <span><span class="dot" style="background:#64719A"></span> Flight track</span>
        </div>
      </div>
    </div>
  </main>
</div>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/map.js"></script>
</body>
</html>
